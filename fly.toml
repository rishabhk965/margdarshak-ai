# fly.toml — Fly.io deployment config
# Run `flyctl launch` first to set the app name and region, then `flyctl deploy`.
# Secrets are managed via `flyctl secrets set KEY=VALUE` (NOT in this file).

app = "margdarshak-ai"
primary_region = "bom"  # Mumbai - closest to India

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  AI_PROVIDER = "gemini"
  WHATSAPP_GRAPH_API_VERSION = "v25.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # keep 1 warm so webhooks are never delayed by cold-start

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[services.ports]]
  handlers = ["http"]
  port = 80
  force_https = true

[[services.ports]]
  handlers = ["tls", "http"]
  port = 443
