spring:
  application:
    name: margdarshak-ai-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

ai:
  active-provider: gemini

anthropic:
  api-key: test-key

gemini:
  api-key: test-key

logging:
  level:
    com.margdarshak.ai: DEBUG
